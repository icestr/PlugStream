name: Feature Request
description: Propose a new feature or enhancement for PlugStream
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case
      description: Describe the use case or problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you expect this feature to work.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
